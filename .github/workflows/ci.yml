name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & Integration Tests
        run: pnpm test

      - name: Production Build
        run: pnpm build

      - name: Verify Service Worker and Precache artifacts
        run: |
          test -f dist/sw.js || (echo "sw.js missing from dist" && exit 1)
          test -f dist/manifest.webmanifest || (echo "manifest.webmanifest missing from dist" && exit 1)
          test -f dist/index.html || (echo "index.html missing from dist" && exit 1)
